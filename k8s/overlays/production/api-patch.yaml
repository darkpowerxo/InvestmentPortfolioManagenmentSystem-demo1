apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: api
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: Features__EnableSwagger
          value: "false"
        - name: Features__EnableDetailedErrors
          value: "false"
        - name: Features__EnableMetrics
          value: "true"
        - name: Features__EnableTracing
          value: "true"
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL