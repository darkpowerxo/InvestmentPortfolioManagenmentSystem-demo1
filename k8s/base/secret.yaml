apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  labels:
    app.kubernetes.io/name: investment-portfolio-manager
    app.kubernetes.io/component: api
type: Opaque
stringData:
  # Database password (base64 encoded in actual deployment)
  SA_PASSWORD: "YourStrong@Passw0rd"
  
  # JWT Secret Key (generate a strong secret in production)
  JWT_SECRET_KEY: "your-256-bit-secret-key-here-make-it-very-long-and-secure"
  
  # Redis Password (if authentication is enabled)
  REDIS_PASSWORD: ""
  
  # Encryption keys for sensitive data
  DATA_ENCRYPTION_KEY: "your-data-encryption-key-32-chars"
  
  # External service API keys (if applicable)
  EXTERNAL_API_KEY: ""
  
  # SMTP settings for email notifications (if applicable)
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  
  # Monitoring and logging tokens
  LOGGING_TOKEN: ""
  METRICS_TOKEN: ""