apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: investment-portfolio-manager
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: investment-portfolio-manager
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: investment-portfolio-manager
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: api
    spec:
      containers:
      - name: api
        image: portfolio-api:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: ConnectionStrings__DefaultConnection
        - name: ConnectionStrings__RedisConnection
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: ConnectionStrings__RedisConnection
        - name: JwtSettings__SecretKey
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: JWT_SECRET_KEY
        - name: JwtSettings__Issuer
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: JwtSettings__Issuer
        - name: JwtSettings__Audience
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: JwtSettings__Audience
        - name: JwtSettings__ExpirationMinutes
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: JwtSettings__ExpirationMinutes
        - name: JwtSettings__RefreshTokenExpirationDays
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: JwtSettings__RefreshTokenExpirationDays
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: SA_PASSWORD
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: reports-volume
          mountPath: /app/reports
        - name: temp-volume
          mountPath: /tmp
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 10
      initContainers:
      - name: wait-for-db
        image: mcr.microsoft.com/mssql-tools
        command:
        - /bin/bash
        - -c
        - |
          until /opt/mssql-tools/bin/sqlcmd -S sql-server-service -U sa -P $SA_PASSWORD -Q "SELECT 1" &> /dev/null; do
            echo "Waiting for SQL Server..."
            sleep 5
          done
          echo "SQL Server is ready!"
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: SA_PASSWORD
      - name: wait-for-redis
        image: redis:7-alpine
        command:
        - /bin/sh
        - -c
        - |
          until redis-cli -h redis-service ping | grep PONG; do
            echo "Waiting for Redis..."
            sleep 2
          done
          echo "Redis is ready!"
      volumes:
      - name: reports-volume
        persistentVolumeClaim:
          claimName: api-reports-pvc
      - name: temp-volume
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  labels:
    app.kubernetes.io/name: investment-portfolio-manager
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: api
spec:
  selector:
    app.kubernetes.io/name: investment-portfolio-manager
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: api
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP